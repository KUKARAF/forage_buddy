<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<title>Forage Buddy</title>

		<!-- Security: safe, host-independent meta tags. -->
		<meta name="referrer" content="strict-origin-when-cross-origin" />

		<!--
			Dark mode bootstrap: applies the `dark` class to <html> BEFORE first
			paint, so there's no flash of the wrong theme while Svelte loads and
			hydrates ($lib/theme.svelte.ts takes over from here once it's up).
			Reads the same localStorage key + resolution rule ('system' falls
			back to prefers-color-scheme) as that module. Inline and synchronous
			(no src, no type="module", no async/defer) so it blocks parsing and
			always runs ahead of paint; safe under this app's CSP since the
			backend's script-src allows 'unsafe-inline' (see security.rs) and
			this introduces no eval and no external script source.
		-->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('forage-buddy-theme');
					var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
					var dark =
						theme === 'dark' ||
						(theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {
					// localStorage/matchMedia unavailable — fall back to light, the
					// default :root palette.
				}
			})();
		</script>

		<!--
			Content-Security-Policy is intentionally NOT set as a <meta http-equiv>
			here. The Rust server sets the CSP (and other security headers) on EVERY
			response — including this static SPA shell — via a response-header
			middleware. The Tauri APK build sets its own CSP in
			crates/mobile/tauri.conf.json (its connect-src also allows the remote
			backend origin).

			Why it is not a <meta> tag: the SvelteKit static build emits an inline
			bootstrap <script> with no nonce, and connect-src must allow the
			(build-time-unknown) backend origin from PUBLIC_API_BASE_URL.
		-->

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
