[workspace]
resolver = "2"
members = ["crates/server", "crates/core", "crates/mobile"]
# `crates/mobile` only *compiles* under the Android/Tauri toolchain (NDK), so
# host CI builds/tests use `--workspace --exclude mobile`. It is still a
# member so the whole tree shares one Cargo.lock.

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8" }
axum-extra = { version = "0.12", features = ["cookie", "cookie-private", "cookie-key-expansion", "with-rejection"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["fs", "trace", "cors", "timeout"] }
# Pinned to 0.14 to match tower-sessions-sqlx-store 0.15 (same rationale as
# ai_buddy/rust_note: 0.15's stores disagree on tower-sessions-core).
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
openidconnect = "4.0"
# Outbound HTTP for the LLM provider + Wikipedia REST API. rustls-only.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

base64 = "0.22"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1.24", features = ["v4"] }
rand = "0.10"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
# Photo decode/resize before sending to the vision model (phone camera photos
# are huge; downscaling controls LLM cost/latency and storage).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

tauri = "2.11"
tempfile = "3.14"

forage-buddy-core = { path = "crates/core" }

# Panic-safety gate (see ai_buddy/rust_note's rationale). Deny lints only
# affect `cargo clippy`, never `cargo build`/`check`. Test code is exempted
# via clippy.toml's allow-*-in-tests keys. Each crate opts in with
# `[lints] workspace = true`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
