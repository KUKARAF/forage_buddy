name: Docker image

# Builds the server image (root Dockerfile: frontend build + release server +
# static serving) and publishes it to GHCR on every push to main, so the
# production host can `docker compose pull` instead of building locally.
#
# NOTE: the first publish creates the GHCR package as PRIVATE. Either flip it
# to public once (GitHub → Packages → forage_buddy → settings) or `docker
# login ghcr.io` on the deploy host with a read:packages token.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build:
    name: Build and push server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/kukaraf/forage_buddy:latest
            ghcr.io/kukaraf/forage_buddy:${{ github.sha }}
          # Link the package to this repo (also drives GHCR's repo sidebar).
          labels: |
            org.opencontainers.image.source=https://github.com/KUKARAF/forage_buddy
          cache-from: type=gha
          cache-to: type=gha,mode=max
